#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-22.04
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        #钉住主版本，避免上游 main 的 breaking change 或供应链投毒直接炸掉流水线
        uses: actions/checkout@v4

      - name: Free Disk Space
        #冷编需要大量磁盘空间；释放 runner 上预装但用不到的 Android / .NET / Haskell / Docker
        #钉住 commit，避免浮动 main 的供应链风险（借鉴 qca-all-in-one）
        uses: jlumbroso/free-disk-space@cf1e78c50ca91e757bab3edc229027eebfc07871
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev dwarves
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

          #dae/daed 的 BPF 目标由宿主 clang 编译（CONFIG_BPF_TOOLCHAIN_HOST）。
          #官方 init 脚本只加 LLVM 源、不装 clang/llvm/lld，这里显式补上。
          sudo -E apt -yqq install clang llvm lld
          #OpenWrt bpf.mk 用通用名查找 llc/opt/llvm-dis/llvm-strip；
          #部分 runner 只有带版本后缀的二进制，补通用软链避免二次失败。
          CLANG_REAL=$(readlink -f "$(command -v clang)")
          LLVM_BIN_DIR=$(dirname "$CLANG_REAL")
          if [ -d "$LLVM_BIN_DIR" ]; then
            for BPF_TOOL in llc opt llvm-dis llvm-strip; do
              TOOL_PATH=$(command -v "$BPF_TOOL" 2>/dev/null || true)
              if [ -z "$TOOL_PATH" ] && [ -x "$LLVM_BIN_DIR/$BPF_TOOL" ]; then
                sudo ln -sf "$LLVM_BIN_DIR/$BPF_TOOL" "/usr/local/bin/$BPF_TOOL"
              fi
            done
          fi
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[^=_]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[^=_]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
          WRT_WIFI=$(grep -oE 'WIFI-(YES|NO)$' <<< "${WRT_CONFIG^^}" || true); WRT_WIFI=${WRT_WIFI:-none}

          {
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_WIFI=$WRT_WIFI"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@v4
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          #缓存工具链版本标记：上游 GCC 版本变化时，OpenWrt 靠这个文件触发工具链重建。
          #不缓存的话每次都是全新克隆，文件为空，检查永远通过，会继续用旧工具链。
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*
            ./wrt/.toolchain_build_ver

      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          #部分命中（restore-keys 前缀）时可能只有 .ccache，没有 staging_dir，
          #此时 find 会报错；先判断目录存在。
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done
          fi
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          #TEST 输入为真时只输出配置文件，不追加 GENERAL.txt 的插件列表
          if [[ "$WRT_TEST" == 'true' ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc) && make clean -j$(nproc)

      - name: Archive Full Config
        #TEST 模式把 defconfig 结果落成完整配置存档，便于追踪上游改名/依赖变化
        if: ${{ inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          echo "========== 完整 .config =========="
          cat .config
          echo "========== 完整 .config 结束 =========="
          mkdir -p ./config-output
          cp ./.config ./config-output/"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE"-full.config
          ls -lh ./config-output/

      - name: Upload Config Artifact
        if: ${{ inputs.WRT_TEST }}
        uses: actions/upload-artifact@v4
        with:
          name: config-${{ inputs.WRT_CONFIG }}-${{ github.run_number }}
          path: ./wrt/config-output/*-full.config

      - name: Verify Config
        #defconfig 会静默丢掉上游已改名或不存在的 CONFIG 符号。
        #这里确认关键插件真的进了 .config，避免编出一个缺功能的固件还显示成功。
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          FAIL=0

          for SYM in \
            "CONFIG_PACKAGE_luci-theme-$WRT_THEME" \
            CONFIG_PACKAGE_luci-app-passwall \
            CONFIG_PACKAGE_luci-app-homeproxy \
            CONFIG_PACKAGE_luci-app-nikki \
            CONFIG_PACKAGE_luci-app-daede \
            CONFIG_PACKAGE_dae \
            CONFIG_PACKAGE_daed \
            CONFIG_DAE_USE_VMLINUX_BTF \
            CONFIG_DAED_USE_VMLINUX_BTF \
            CONFIG_PACKAGE_vmlinux-btf \
            CONFIG_PACKAGE_luci-app-bandix \
            CONFIG_PACKAGE_luci-app-easytier \
            CONFIG_PACKAGE_luci-app-lucky \
            CONFIG_PACKAGE_luci-app-taskplan \
            CONFIG_PACKAGE_luci-app-upnp \
            CONFIG_PACKAGE_luci-app-natmapt \
            CONFIG_PACKAGE_luci-app-wolultra \
            CONFIG_PACKAGE_odhcpd-ipv6only \
            CONFIG_IPV6
          do
            if grep -q "^$SYM=y" .config; then
              echo "[config] OK   $SYM=y"
            else
              echo "[config] FAIL $SYM=y 不在 .config 里"
              FAIL=1
            fi
          done

          for SYM in luci-app-autoreboot luci-app-partexp luci-app-mini-diskmanager; do
            if grep -q "^CONFIG_PACKAGE_$SYM=y" .config; then
              echo "[config] FAIL $SYM 应为 n，实际为 y"
              FAIL=1
            else
              echo "[config] OK   $SYM 未启用"
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "ERROR: .config 与预期不符，可能上游改了包名或依赖。"
            exit 1
          fi

      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/

          make download -j$(nproc)
          #清理下载不完整的小文件，避免后续编译读取坏包（借鉴 qca-all-in-one）
          find dl -size -1024c -type f -print -delete

      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        # 冷编（无缓存）实测 6.5h 以上，会撞 GitHub 单 job 6 小时上限，
        # 被硬取消后缓存来不及保存，形成"永远编不完"的死锁。
        # 这里给编译 4h50m 上限，超时就带着已完成的工具链缓存正常收尾，
        # 下一次运行直接复用缓存继续编。
        timeout-minutes: 300
        continue-on-error: true
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Check Build Output
        id: build-output
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          IMG=$(ls bin/targets/*/*/*sysupgrade.bin 2>/dev/null | head -1)
          COMPLETE=false

          if [ -n "$IMG" ]; then
            DIR=$(dirname "$IMG")
            BASE=$(basename "$IMG")
            # 编译被时限打断时可能留下写了一半的镜像，必须用 sha256sums 校验完整性，
            # 否则会把坏固件发出去。
            WANT=$(awk -v f="$BASE" '$2 == f || $2 == "*" f {print $1; exit}' "$DIR/sha256sums" 2>/dev/null)
            GOT=$(sha256sum "$IMG" | awk '{print $1}')
            if [ -n "$WANT" ] && [ "$WANT" = "$GOT" ]; then
              COMPLETE=true
            else
              echo "镜像校验未通过：$BASE（可能写了一半）"
            fi
          fi

          echo "complete=$COMPLETE" >> "$GITHUB_OUTPUT"
          if [ "$COMPLETE" = "true" ]; then
            echo "固件已生成并通过 sha256 校验"
          else
            echo "本次未编完，缓存已保存，再跑一次会接着编"
          fi

      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        # 缓存 key 已存在时 save 会报错，不能因此判整个 job 失败
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*
            ./wrt/.toolchain_build_ver

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        if: ${{ inputs.WRT_TEST || steps.build-output.outputs.complete == 'true' }}
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        if: ${{ inputs.WRT_TEST || steps.build-output.outputs.complete == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            全系带开源硬件加速，别问了！

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

      - name: Report Incomplete Build
        # 没编出固件就是失败，但缓存已经存好，再跑一次能接着编
        if: ${{ !inputs.WRT_TEST && steps.build-output.outputs.complete != 'true' }}
        run: |
          echo "::error::本次编译没有产出固件（超时或报错），工具链缓存已保存。重新运行同一 workflow 会复用缓存继续编译。"
          exit 1

  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-22.04
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail

          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"

          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi

          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done
