name: Auto-Clean

on:
  #自动清理：每天早上5点
  schedule:
    - cron: 21 21 * * *
  #手动清理
  workflow_dispatch:

permissions: write-all

jobs:
  auto_clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Releases and Workflows
        #钉住 commit：该 action 拿到 write-all 令牌，浮动的 @main 有供应链风险。
        #f5873e6 是当前 main，即一直在用的版本，行为不变。
        uses: ophub/delete-releases-workflows@f5873e66feb0a85460d7fbc073de6c89470e94d3
        with:
          gh_token: ${{secrets.GITHUB_TOKEN}}
          delete_releases: true
          #保留最近 3 个固件；原配置是 0，等于每天把刚发的固件全删掉
          releases_keep_latest: 3
          delete_tags: true
          delete_workflows: true
          #保留最近 7 天的运行记录，便于事后查日志；原配置是 0，等于全删
          workflows_keep_day: 7
